version: "3.9"

services:
  couchdb:
    image: couchdb:latest
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ./data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/obsidian.ini
    networks:
      - obsidian

  obsidian-headless:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian-headless
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
    volumes:
      - ./config:/config
      - ./vault:/vault
    networks:
      - obsidian

  obsidian-mcp:
    build:
      context: ./mcp-src
      dockerfile: Dockerfile
    container_name: obsidian-mcp
    restart: unless-stopped
    environment:
      - MCP_API_KEY=${MCP_API_KEY}
      - VAULT_PATH=/vault
    volumes:
      - ./vault:/vault:rw
    networks:
      - obsidian

networks:
  obsidian:
    external: true
