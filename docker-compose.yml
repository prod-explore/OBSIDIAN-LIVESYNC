version: "3.9"

services:
  couchdb:
    image: couchdb:latest
    container_name: obsidian-couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ./data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/obsidian.ini
    networks:
      - obsidian

  obsidian-headless:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian-headless
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - CUSTOM_USER=${VNC_USER}
      - PASSWORD=${VNC_PASSWORD}
    volumes:
      - ./config:/config
      - ./vault:/vault
    networks:
      - obsidian

  obsidian-mcp:
    build:
      context: ./mcp-src
      dockerfile: Dockerfile
    container_name: obsidian-mcp
    restart: unless-stopped
    environment:
      - MCP_API_KEY=${MCP_API_KEY}
      - VAULT_PATH=/vault/vault-mcp
    user: "1000:1000"
#    ports:
#      - "3000:3000"
    volumes:
      - ./vault:/vault:rw
    networks:
      - obsidian

  obsidian-gcal-sync:
    build:
      context: ./gcal-sync-src
      dockerfile: Dockerfile
    container_name: obsidian-gcal-sync
    restart: unless-stopped
    environment:
      - VAULT_PATH=/vault/vault-mcp
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - CALENDAR_IDS=${CALENDAR_IDS:-primary}
      - TASKLIST_IDS=${TASKLIST_IDS:-@default}
      - POLL_INTERVAL_MINUTES=${POLL_INTERVAL_MINUTES:-5}
      - DATA_PATH=/data
      - TZ=Europe/Warsaw
    user: "1000:1000"
    volumes:
      - ./vault:/vault:rw
      - ./gcal-sync-state:/data
    networks:
      - obsidian

networks:
  obsidian:
    external: true
