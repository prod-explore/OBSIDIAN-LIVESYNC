; CouchDB settings for the Self-hosted LiveSync plugin, mounted into the couchdb container (see docker-compose.yml).
; The Obsidian apps talk to CouchDB from their own origins, so CORS has to allow those: app://obsidian.md is the
; desktop app, capacitor://localhost and http://localhost the mobile apps.

[httpd]
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer, x-csrf-token
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
