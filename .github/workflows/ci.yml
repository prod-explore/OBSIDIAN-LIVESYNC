name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The two packages keep their own copy of the logger (they are built and shipped separately).
      - name: logger.ts is identical in both packages
        run: diff packages/mcp/src/logger.ts packages/gcal-sync/src/logger.ts

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mcp, gcal-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks (strict), builds, runs every test, and fails below the coverage floor in .c8rc.json.
      - name: test with coverage
        shell: bash
        run: |
          npm run test:coverage --workspace packages/${{ matrix.package }} | tee coverage.txt
          { echo '### Coverage: ${{ matrix.package }}'; echo '```'; sed -n '/^-----/,$p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Runtime dependencies only; high and critical advisories fail the build.
      - run: npm audit --omit=dev --audit-level=high

  images:
    name: docker build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mcp, gcal-sync]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/${{ matrix.package }}/Dockerfile .

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file against .env.example
        run: |
          cp .env.example .env
          # The required secrets are empty in the example on purpose; compose must reject that ...
          if docker compose config -q 2>/dev/null; then echo "compose accepted empty secrets"; exit 1; fi
          # ... and accept the file once they are filled in.
          MCP_API_KEY=ci COUCHDB_PASSWORD=ci VNC_PASSWORD=ci docker compose config -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
